[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvgenerator"
version = "0.1.0"
description = "Outil 100 % hors ligne de gestion et de génération de CV / dossiers de compétences multilingues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "docxtpl>=0.16",
    "Jinja2>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
GestionCollaborateur = "cvgenerator.ui.gestion_collaborateur:main"
GestionProjets = "cvgenerator.ui.gestion_projets:main"
GenerateurCV = "cvgenerator.ui.generateur_cv:main"
cvgenerator = "cvgenerator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvgenerator = ["translations/*.json"]
